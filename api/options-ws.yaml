          description: Maker-only flag
        createdAt:
          type: integer
          format: int64
          description: Creation time (ms since epoch)
        updatedAt:
          type: integer
          format: int64
          description: Last update time (ms since epoch)
        clientRequestId:
          type: string
          description: Client-generated UUID for correlation
      required:
