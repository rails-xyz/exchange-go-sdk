    SessionBackfillNotification:
      name: sessionBackfill
      title: Session Backfill
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `sessionBackfill`.
          data:
            type: object
            properties:
              sessionId:
                type: string
                description: Echoes the `sessionId` query parameter supplied on the connection.
              resumed:
                type: boolean
                description: >
                  `true` if this session continues a live position from a
                  prior connection with the same `sessionId` that reconnected
                  within the 1-minute backfill window. `false` for a new
                  `sessionId`, or a reused one outside that window — no
                  backfill occurs, and local order state must be reconciled
                  from scratch via HTTP endpoints or `emit` requests.
              from:
                type: integer
                format: int64
                description: >
                  Unix timestamp (ms) marking the start of the backfill
                  window. `0` when `resumed` is `false`.
              to:
                type: integer
                format: int64
                description: Unix timestamp (ms) marking the end of the backfill window.
              events:
                type: integer
                description: Total number of missed order events backfilled across all contracts.
              backfilledMarkets:
                type: array
                description: Contracts whose missed events were fully backfilled.
                items:
                  type: string
              expiredMarkets:
                type: array
                description: Contracts with missed events that were not backfilled
                items:
                  type: string
            required: [sessionId, resumed, from, to, events, backfilledMarkets, expiredMarkets]
        required: [resultType, data]
      examples:
        - payload:
            resultType: sessionBackfill
            data:
              sessionId: e4a1c6f0-7b2d-4c8e-9f3a-5d6b8c1e2f4a
              resumed: true
              from: 1784834389615
              to: 1784834449615
              events: 6
              backfilledMarkets: [BTC-3JUL26-55000-C, ETH-31JUL26-1600-C]
              expiredMarkets: []

    LiquidationNotification:
      name: liquidation
      title: Liquidation
      summary: >
        Pushed when your account is liquidated, once for each contract the
        liquidation cancels orders on or closes a position in, before those
        orders are cancelled and positions closed. Carries no
        `clientRequestId`.
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `liquidation`.
          market:
            type: string
            description: Contract name
          data:
            type: object
            properties:
              statusCode:
                type: integer
                description: Always `200`.
              body:
                type: string
                description: Always `liquidation triggered`.
              liquidationId:
                type: string
                description: Identifies the liquidation; the same on every `liquidation` message it produces
              marginRatio:
                type: string
                description: >
                  Maintenance margin as a fraction of total equity when the
                  liquidation triggered; `1` when equity is not positive
              usedMargin:
                type: string
                description: >
                  Maintenance margin of your positions plus the margin locked
                  by your resting orders when the liquidation triggered, in USDT
              totalEquity:
                type: string
                description: Account equity when the liquidation triggered, in USDT
              triggeredAt:
                type: integer
                format: int64
                description: When the liquidation triggered (ms since epoch)
            required: [statusCode, body, liquidationId, marginRatio, usedMargin, totalEquity, triggeredAt]
        required: [resultType, market, data]
      examples:
        - payload:
            resultType: liquidation
            market: BTC-10JUL26-60000-P
            data:
              statusCode: 200
              body: liquidation triggered
