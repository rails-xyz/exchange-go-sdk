    EmitOptionsAccountSummaryRequest:
      name: emitOptionsAccountSummary
      title: Emit Options Account Summary
      summary: >
        Returns the current snapshot; does not subscribe you. Requires an active
        `optionsAccountSummary` subscription for the response to reach you.
        Account-wide, so `market` is ignored.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `emitOptionsAccountSummary`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
        required: [message]
      examples:
        - payload:
            message: emitOptionsAccountSummary
            content:
              clientRequestId: 4cc68b60-ed2d-42aa-a21e-cb5486f8fd1a

    OptionsAccountSummaryResponse:
      name: optionsAccountSummary
      title: Account Summary
      summary: >
        Response to `emitOptionsAccountSummary`. Delivered only while
        subscribed to `optionsAccountSummary`; nothing is pushed on its own.
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `optionsAccountSummary`.
          data:
            type: object
            properties:
              accountSummary:
                type: object
                properties:
                  accountBalance:
                    type: string
                    description: Total account balance
                  availableBalance:
                    type: string
                    description: Balance available for new orders
                  totalEquity:
                    type: string
                    description: Account equity — account balance plus the signed mark value of open positions
                  marginUsed:
                    type: string
                    description: Margin currently in use — the initial margin locked by open positions and resting orders
                  initialMarginRatio:
                    type: string
                    description: "`marginUsed` as a fraction of total equity"
                  maintenanceMargin:
                    type: string
                    description: Maintenance margin requirement across open positions
                  maintenanceMarginRatio:
                    type: string
                    description: Maintenance margin as a fraction of total equity
                  withdrawableBalance:
                    type: string
                    description: Balance available to withdraw
                  unrealizedPnl:
                    type: string
                    description: Unrealized PnL across open positions. Reporting only — not a term in `totalEquity`
                  pnl:
                    type: string
                    description: Cumulative realized PnL
                  fees:
                    type: string
                    description: Cumulative fees
                  volume:
                    type: string
                    description: Cumulative traded volume
                required:
                  - accountBalance
                  - availableBalance
                  - totalEquity
                  - marginUsed
                  - initialMarginRatio
                  - maintenanceMargin
                  - maintenanceMarginRatio
                  - withdrawableBalance
                  - unrealizedPnl
                  - pnl
                  - fees
                  - volume
              statusCode:
                type: integer
                description: Always `200`.
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
            required: [accountSummary, statusCode]
        required: [resultType, data]
      examples:
        - payload:
            resultType: optionsAccountSummary
            data:
              accountSummary:
                accountBalance: "19611.7711628"
                availableBalance: "10636.0473042985"
                totalEquity: "20504.4429067"
