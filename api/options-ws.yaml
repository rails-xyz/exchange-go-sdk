asyncapi: 3.0.0
info:
  title: Rails Options WebSocket API
  version: 1.0.0
  description: >
    Real-time option contracts, quotes, order books, trades, positions, and
    account state, plus order creation and management, for Rails Options.
    All requests and responses share a common envelope: requests are
    `{"message": "<requestType>", "content": {...}}`, responses and stream
    pushes are `{"resultType": "<responseType>", "market"?: "...",
    "data": {...}}`.
defaultContentType: application/json

servers:
  sandbox:
    host: ws.sandbox.rails.xyz
    protocol: wss
    description: >
      Connect with `product=options`, `market`, and — optionally —
      `expiration`, `strike`, `type`, and `subscriptions` query parameters,
      e.g. `wss://ws.sandbox.rails.xyz?product=options&market=BTC-USDT&expiration=24JUN26&strike=62000&type=C`.
      `market` takes a market (`BTC-USDT`) or `ALL` for every market;
      `expiration`, `strike`, and `type` narrow it to a single contract. See the
      [WebSocket overview](/latest/options/websocket-api/overview) for the
      full contract-filter and subscription rules. An optional `sessionId`
      (UUID) query parameter enables a
      [WebSocket Session](/latest/websocket-session) on the Order Management
      Stream.
    security:
      - $ref: '#/components/securitySchemes/wsAuth'

channels:
  commonRequests:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}"
    title: Common Requests
    description: >
      Requests and responses available on every connection regardless of
      active subscriptions.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      pingRequest:
        $ref: '#/components/messages/PingRequest'
      pongResponse:
        $ref: '#/components/messages/PongResponse'
      subscribeRequest:
        $ref: '#/components/messages/SubscribeRequest'
      subscribedResponse:
        $ref: '#/components/messages/SubscribedResponse'
      subscribeError:
        $ref: '#/components/messages/SubscribeError'
      unsubscribeRequest:
        $ref: '#/components/messages/UnsubscribeRequest'
      unsubscribedResponse:
        $ref: '#/components/messages/UnsubscribedResponse'
      unsubscribeError:
        $ref: '#/components/messages/UnsubscribeError'
      connectionShutdownNotice:
        $ref: '#/components/messages/ConnectionShutdownNotice'

  orderManagementStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsOrders&sessionId={sessionId}"
    title: Order Management Stream
    description: >
      Active on the `optionsOrders` subscription, which is on by default
      when you connect (unless the `subscriptions` query parameter replaces
      it). Create, modify, and cancel orders, and receive fill and
      liquidation notifications. Supports a
      [WebSocket Session](/latest/websocket-session) via the connection's
      `sessionId` query parameter.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
      sessionId:
        $ref: '#/components/parameters/sessionId'
    messages:
      createOrderRequest:
        $ref: '#/components/messages/CreateOrderRequest'
      createOrderAck:
        $ref: '#/components/messages/CreateOrderAck'
      createOrderConfirmation:
        $ref: '#/components/messages/CreateOrderConfirmation'
      createOrderError:
        $ref: '#/components/messages/CreateOrderError'
      modifyOrderRequest:
        $ref: '#/components/messages/ModifyOrderRequest'
      modifyOrderAck:
        $ref: '#/components/messages/ModifyOrderAck'
      modifyOrderConfirmation:
        $ref: '#/components/messages/ModifyOrderConfirmation'
      modifyOrderError:
        $ref: '#/components/messages/ModifyOrderError'
      cancelOrderRequest:
        $ref: '#/components/messages/CancelOrderRequest'
      cancelOrderConfirmation:
        $ref: '#/components/messages/CancelOrderConfirmation'
      cancelOrderError:
        $ref: '#/components/messages/CancelOrderError'
      cancelAllOrdersRequest:
        $ref: '#/components/messages/CancelAllOrdersRequest'
      cancelAllOrdersAck:
        $ref: '#/components/messages/CancelAllOrdersAck'
      cancelAllOrdersError:
        $ref: '#/components/messages/CancelAllOrdersError'
      completeFillNotification:
        $ref: '#/components/messages/CompleteFillNotification'
      partialFillNotification:
        $ref: '#/components/messages/PartialFillNotification'
      sessionBackfillNotification:
        $ref: '#/components/messages/SessionBackfillNotification'
      liquidationNotification:
        $ref: '#/components/messages/LiquidationNotification'

  contractsStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsContracts"
    title: Contracts Stream
    description: >
      Available on the `optionsContracts` subscription. Contract
      definitions with live mark price, implied volatility, and Greeks,
      scoped by underlying and expiration date.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitOptionsContractsRequest:
        $ref: '#/components/messages/EmitOptionsContractsRequest'
      optionsContractsResponse:
        $ref: '#/components/messages/OptionsContractsResponse'
      optionsContractUpdate:
        $ref: '#/components/messages/OptionsContractUpdate'

  quotesStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsQuotes"
    title: Quotes Stream
    description: >
      Available on the `optionsQuotes` subscription. Top-of-book bid/ask
      prices with implied volatility per contract, scoped by underlying and
      expiration date.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitOptionsQuotesRequest:
        $ref: '#/components/messages/EmitOptionsQuotesRequest'
      optionsQuotesResponse:
        $ref: '#/components/messages/OptionsQuotesResponse'
      optionsQuotesDelta:
        $ref: '#/components/messages/OptionsQuotesDelta'

  publicOrderBookStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsPublicOrderBook"
    title: Order Book Stream
    description: >
      Available on the `optionsPublicOrderBook` subscription. Full order
      book snapshots and deltas for a single contract, including implied
      volatility per price level.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitPublicOrderBookRequest:
        $ref: '#/components/messages/EmitPublicOrderBookRequest'
      publicOrderBookResponse:
        $ref: '#/components/messages/PublicOrderBookResponse'
      publicOrderBookDelta:
        $ref: '#/components/messages/PublicOrderBookDelta'

  publicTradesStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsPublicTrades"
    title: Public Trades Stream
    description: >
      Available on the `optionsPublicTrades` subscription. Real-time public
      trade executions for a single contract.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitPublicCompletedOrdersRequest:
        $ref: '#/components/messages/EmitPublicCompletedOrdersRequest'
      publicCompletedOrdersResponse:
        $ref: '#/components/messages/PublicCompletedOrdersResponse'
      publicCompletedOrdersDelta:
        $ref: '#/components/messages/PublicCompletedOrdersDelta'

  positionsStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsPositions"
    title: Positions Stream
    description: >
      Available on the `optionsPositions` subscription. Your open option
      positions with mark price, margin, and PnL.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitOptionsPositionsRequest:
        $ref: '#/components/messages/EmitOptionsPositionsRequest'
      optionsPositionsResponse:
        $ref: '#/components/messages/OptionsPositionsResponse'
      optionsPositionsDelta:
        $ref: '#/components/messages/OptionsPositionsDelta'

  openOrdersStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsOpenOrders"
    title: Open Orders Stream
    description: Available on the `optionsOpenOrders` subscription. Your open orders and incremental updates.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitOptionsOpenOrdersRequest:
        $ref: '#/components/messages/EmitOptionsOpenOrdersRequest'
      optionsOpenOrdersResponse:
        $ref: '#/components/messages/OptionsOpenOrdersResponse'
      optionsOpenOrdersDelta:
        $ref: '#/components/messages/OptionsOpenOrdersDelta'

  recentOrdersStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsRecentOrders"
    title: Recent Orders Stream
    description: Available on the `optionsRecentOrders` subscription. Your recent order history.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitOptionsRecentOrdersRequest:
        $ref: '#/components/messages/EmitOptionsRecentOrdersRequest'
      optionsRecentOrdersResponse:
        $ref: '#/components/messages/OptionsRecentOrdersResponse'
      optionsRecentOrdersDelta:
        $ref: '#/components/messages/OptionsRecentOrdersDelta'

  accountSummaryStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsAccountSummary"
    title: Account Summary Stream
    description: >
      Available on the `optionsAccountSummary` subscription. Your account
      balance, margin usage, and PnL. `emitOptionsAccountSummary` returns the
      current snapshot and does not subscribe you — without the
      subscription the snapshot never reaches you, and nothing is pushed on
      its own. The summary is account-wide; the emit takes no `market`, and
      any contract filter is ignored.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitOptionsAccountSummaryRequest:
        $ref: '#/components/messages/EmitOptionsAccountSummaryRequest'
      optionsAccountSummaryResponse:
        $ref: '#/components/messages/OptionsAccountSummaryResponse'

  settlementsStream:
    address: "?product=options&market={market}&expiration={expiration}&strike={strike}&type={type}&subscriptions=optionsSettlements"
    title: Settlements Stream
    description: Available on the `optionsSettlements` subscription. Settlement results for your positions at expiry.
    parameters:
      market:
        $ref: '#/components/parameters/market'
      expiration:
        $ref: '#/components/parameters/expiration'
      strike:
        $ref: '#/components/parameters/strike'
      type:
        $ref: '#/components/parameters/type'
    messages:
      emitOptionsSettlementsRequest:
        $ref: '#/components/messages/EmitOptionsSettlementsRequest'
      optionsSettlementsResponse:
        $ref: '#/components/messages/OptionsSettlementsResponse'

operations:
  ping:
    action: receive
    channel:
      $ref: '#/channels/commonRequests'
    summary: Application-level heartbeat, available with or without a subscription.
    messages:
      - $ref: '#/channels/commonRequests/messages/pingRequest'
  pong:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    messages:
      - $ref: '#/channels/commonRequests/messages/pongResponse'
  subscribe:
    action: receive
    channel:
      $ref: '#/channels/commonRequests'
    summary: Add one or more streams to the current connection, for one market or several.
    messages:
      - $ref: '#/channels/commonRequests/messages/subscribeRequest'
  subscribed:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    summary: Confirmation (200) or error response (400) to `subscribe`.
    messages:
      - $ref: '#/channels/commonRequests/messages/subscribedResponse'
      - $ref: '#/channels/commonRequests/messages/subscribeError'
  unsubscribe:
    action: receive
    channel:
      $ref: '#/channels/commonRequests'
    summary: Remove one or more streams from the current connection, for one market or every market.
    messages:
      - $ref: '#/channels/commonRequests/messages/unsubscribeRequest'
  unsubscribed:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    summary: Confirmation (200) or error response (400) to `unsubscribe`.
    messages:
      - $ref: '#/channels/commonRequests/messages/unsubscribedResponse'
      - $ref: '#/channels/commonRequests/messages/unsubscribeError'
  connectionShutdown:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    summary: Pushed unprompted when the connection is scheduled to close; reconnect before the deadline it carries.
    messages:
      - $ref: '#/channels/commonRequests/messages/connectionShutdownNotice'

  createOrder:
    action: receive
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Create a limit or market order.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/createOrderRequest'
  createOrderResult:
    action: send
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Acknowledgment (202), confirmation (200), or error response to `createOrder`.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/createOrderAck'
      - $ref: '#/channels/orderManagementStream/messages/createOrderConfirmation'
      - $ref: '#/channels/orderManagementStream/messages/createOrderError'

  modifyOrder:
    action: receive
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Modify the price and/or quantity of an existing order.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/modifyOrderRequest'
  modifyOrderResult:
    action: send
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Acknowledgment (202), confirmation (200), or error response to `modifyOrder`.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/modifyOrderAck'
      - $ref: '#/channels/orderManagementStream/messages/modifyOrderConfirmation'
      - $ref: '#/channels/orderManagementStream/messages/modifyOrderError'

  cancelOrder:
    action: receive
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Cancel an order by ID.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/cancelOrderRequest'
  cancelOrderResult:
    action: send
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Confirmation (200) or error response to `cancelOrder`.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/cancelOrderConfirmation'
      - $ref: '#/channels/orderManagementStream/messages/cancelOrderError'

  cancelAllOrders:
    action: receive
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Cancel every resting order on one contract, or account-wide.
    description: |
      One `cancelAllOrders` acknowledgment and one `cancelOrder` result per order swept, in any
      order, each carrying this request's `clientRequestId`. Also available over
      HTTP as Cancel All Orders; see
      [Releasing Capital on Disconnect](/latest/websocket-session#releasing-capital-on-disconnect).
    messages:
      - $ref: '#/channels/orderManagementStream/messages/cancelAllOrdersRequest'
  cancelAllOrdersResult:
    action: send
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Acknowledgment (202) with the number of cancels dispatched, or error response to `cancelAllOrders`.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/cancelAllOrdersAck'
      - $ref: '#/channels/orderManagementStream/messages/cancelAllOrdersError'

  orderFilled:
    action: send
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Pushed when an order is completely or partially filled.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/completeFillNotification'
      - $ref: '#/channels/orderManagementStream/messages/partialFillNotification'

  sessionBackfill:
    action: send
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: >
      Pushed once per connection whenever `sessionId` is supplied. Summarizes
      any missed order events backfilled since the last delivered position, or
      reports that none were backfilled.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/sessionBackfillNotification'

  liquidation:
    action: send
    channel:
      $ref: '#/channels/orderManagementStream'
    summary: Pushed when your account is liquidated, once for each contract the liquidation acts on.
    messages:
      - $ref: '#/channels/orderManagementStream/messages/liquidationNotification'

  emitOptionsContracts:
    action: receive
    channel:
      $ref: '#/channels/contractsStream'
    summary: Request the full set of contracts for an underlying and expiration date. Requires the `optionsContracts` subscription for the requested underlying, or `ALL`, for the response to reach you.
    messages:
      - $ref: '#/channels/contractsStream/messages/emitOptionsContractsRequest'
  optionsContractsSnapshot:
    action: send
    channel:
      $ref: '#/channels/contractsStream'
    summary: Response to `emitOptionsContracts`.
    messages:
      - $ref: '#/channels/contractsStream/messages/optionsContractsResponse'
  optionsContractUpdate:
    action: send
    channel:
      $ref: '#/channels/contractsStream'
    summary: Pushed as a contract's price, IV, and Greeks change.
    messages:
      - $ref: '#/channels/contractsStream/messages/optionsContractUpdate'

  emitOptionsQuotes:
    action: receive
    channel:
      $ref: '#/channels/quotesStream'
    summary: Request top-of-book quotes for an underlying and expiration date. Requires the `optionsQuotes` subscription for the requested underlying, or `ALL`, for the response to reach you.
    messages:
      - $ref: '#/channels/quotesStream/messages/emitOptionsQuotesRequest'
  optionsQuotesSnapshot:
    action: send
    channel:
      $ref: '#/channels/quotesStream'
    summary: Response to `emitOptionsQuotes`.
    messages:
      - $ref: '#/channels/quotesStream/messages/optionsQuotesResponse'
  optionsQuotesUpdate:
    action: send
    channel:
      $ref: '#/channels/quotesStream'
    summary: Pushed whenever the top-of-book changes for a contract.
    messages:
      - $ref: '#/channels/quotesStream/messages/optionsQuotesDelta'

  emitPublicOrderBook:
    action: receive
    channel:
      $ref: '#/channels/publicOrderBookStream'
    summary: Request a full order book snapshot for a contract. Requires the `optionsPublicOrderBook` subscription, with a filter covering the request, for the response to reach you.
    messages:
      - $ref: '#/channels/publicOrderBookStream/messages/emitPublicOrderBookRequest'
  publicOrderBookSnapshot:
    action: send
    channel:
      $ref: '#/channels/publicOrderBookStream'
    summary: Response to `emitPublicOrderBook`.
    messages:
      - $ref: '#/channels/publicOrderBookStream/messages/publicOrderBookResponse'
  publicOrderBookUpdate:
    action: send
    channel:
      $ref: '#/channels/publicOrderBookStream'
    summary: Pushed whenever the order book changes for the contract.
    messages:
      - $ref: '#/channels/publicOrderBookStream/messages/publicOrderBookDelta'

  emitPublicCompletedOrders:
    action: receive
    channel:
      $ref: '#/channels/publicTradesStream'
    summary: Request a snapshot of recent public trades for a contract. Requires the `optionsPublicTrades` subscription, with a filter covering the request, for the response to reach you.
    messages:
      - $ref: '#/channels/publicTradesStream/messages/emitPublicCompletedOrdersRequest'
  publicTradesSnapshot:
    action: send
    channel:
      $ref: '#/channels/publicTradesStream'
    summary: Response to `emitPublicCompletedOrders`.
    messages:
      - $ref: '#/channels/publicTradesStream/messages/publicCompletedOrdersResponse'
  publicTradesUpdate:
    action: send
    channel:
      $ref: '#/channels/publicTradesStream'
    summary: Pushed whenever new trades are executed on the contract.
    messages:
      - $ref: '#/channels/publicTradesStream/messages/publicCompletedOrdersDelta'

  emitOptionsPositions:
    action: receive
    channel:
      $ref: '#/channels/positionsStream'
    summary: Request a snapshot of your open positions. Requires the `optionsPositions` subscription, with a filter covering the request, for the response to reach you.
    messages:
      - $ref: '#/channels/positionsStream/messages/emitOptionsPositionsRequest'
  optionsPositionsSnapshot:
    action: send
    channel:
      $ref: '#/channels/positionsStream'
    summary: Response to `emitOptionsPositions`.
    messages:
      - $ref: '#/channels/positionsStream/messages/optionsPositionsResponse'
  optionsPositionsUpdate:
    action: send
    channel:
      $ref: '#/channels/positionsStream'
    summary: Pushed whenever your positions change.
    messages:
      - $ref: '#/channels/positionsStream/messages/optionsPositionsDelta'

  emitOptionsOpenOrders:
    action: receive
    channel:
      $ref: '#/channels/openOrdersStream'
    summary: Request a snapshot of your open orders. Requires the `optionsOpenOrders` subscription, with a filter covering the request, for the response to reach you.
    messages:
      - $ref: '#/channels/openOrdersStream/messages/emitOptionsOpenOrdersRequest'
  optionsOpenOrdersSnapshot:
    action: send
    channel:
      $ref: '#/channels/openOrdersStream'
    summary: Response to `emitOptionsOpenOrders`.
    messages:
      - $ref: '#/channels/openOrdersStream/messages/optionsOpenOrdersResponse'
  optionsOpenOrdersUpdate:
    action: send
    channel:
      $ref: '#/channels/openOrdersStream'
    summary: Pushed whenever an order is added to or drops from your open orders.
    messages:
      - $ref: '#/channels/openOrdersStream/messages/optionsOpenOrdersDelta'

  emitOptionsRecentOrders:
    action: receive
    channel:
      $ref: '#/channels/recentOrdersStream'
    summary: Request a snapshot of your recent order history. Requires the `optionsRecentOrders` subscription, with a filter covering the request, for the response to reach you.
    messages:
      - $ref: '#/channels/recentOrdersStream/messages/emitOptionsRecentOrdersRequest'
  optionsRecentOrdersSnapshot:
    action: send
    channel:
      $ref: '#/channels/recentOrdersStream'
    summary: Response to `emitOptionsRecentOrders`.
    messages:
      - $ref: '#/channels/recentOrdersStream/messages/optionsRecentOrdersResponse'
  optionsRecentOrdersUpdate:
    action: send
    channel:
      $ref: '#/channels/recentOrdersStream'
    summary: Pushed whenever your recent order history changes.
    messages:
      - $ref: '#/channels/recentOrdersStream/messages/optionsRecentOrdersDelta'

  emitOptionsAccountSummary:
    action: receive
    channel:
      $ref: '#/channels/accountSummaryStream'
    summary: Request the current account summary snapshot. Requires the `optionsAccountSummary` subscription for the response to reach you.
    messages:
      - $ref: '#/channels/accountSummaryStream/messages/emitOptionsAccountSummaryRequest'
  optionsAccountSummaryUpdate:
    action: send
    channel:
      $ref: '#/channels/accountSummaryStream'
    summary: Response to `emitOptionsAccountSummary`. Delivered only while subscribed to `optionsAccountSummary`; nothing is pushed on its own.
    messages:
      - $ref: '#/channels/accountSummaryStream/messages/optionsAccountSummaryResponse'

  emitOptionsSettlements:
    action: receive
    channel:
      $ref: '#/channels/settlementsStream'
    summary: Request a snapshot of your settlement history. Requires the `optionsSettlements` subscription, with a filter covering the request, for the response to reach you.
    messages:
      - $ref: '#/channels/settlementsStream/messages/emitOptionsSettlementsRequest'
  optionsSettlementsSnapshot:
    action: send
    channel:
      $ref: '#/channels/settlementsStream'
    summary: Response to `emitOptionsSettlements`.
    messages:
      - $ref: '#/channels/settlementsStream/messages/optionsSettlementsResponse'

components:
  parameters:
    market:
      description: A specific market (e.g. `BTC-USDT`) or `ALL`.
      default: BTC-USDT
    expiration:
      description: "Contract expiration, e.g. `24JUN26`. Requires `market`; omit to match every expiration."
      default: 24JUN26
    strike:
      description: "Strike price, e.g. `62000`. Requires `expiration`; omit to match every strike."
      default: "62000"
    type:
      description: "`C` (call) or `P` (put). Requires `strike`; omit to match both."
      default: C
    sessionId:
      description: >
        UUID identifying a session. Enables
        [WebSocket Session](/latest/websocket-session) on this stream. Omit
        to opt out.
      default: e4a1c6f0-7b2d-4c8e-9f3a-5d6b8c1e2f4a

  securitySchemes:
    wsAuth:
      type: httpApiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: Supply as `authorization#<JWT>` during the WebSocket handshake.

  schemas:
    ErrorDetail:
      type: object
      properties:
        slug:
          type: string
          description: Machine-readable error slug
        code:
          type: string
          description: Error code
      required: [slug, code]

    Order:
      type: object
      description: Omitted entirely from some error responses; when present, all fields below are populated.
      properties:
        contract:
          type: string
