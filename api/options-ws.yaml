  messages:
    PingRequest:
      name: ping
      title: Ping
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `ping`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
        required: [message]
      examples:
        - payload:
            message: ping
            content:
              clientRequestId: 4cc68b60-ed2d-42aa-a21e-cb5486f8fd1a

    PongResponse:
      name: pong
      title: Pong
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `pong`.
          data:
            type: object
            properties:
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
              statusCode:
                type: integer
                description: Always `200`.
            required: [statusCode]
        required: [resultType, data]
      examples:
        - payload:
            resultType: pong
            data:
              clientRequestId: 4cc68b60-ed2d-42aa-a21e-cb5486f8fd1a
              statusCode: 200

    SubscribeRequest:
      name: subscribe
      title: Subscribe
      summary: Add one or more streams to the current connection, for one or more markets.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `subscribe`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
              subscriptions:
                type: array
                description: One or more subscriptions to add
                items:
                  type: string
                  enum:
                    - optionsOrders
                    - optionsContracts
                    - optionsQuotes
                    - optionsPublicOrderBook
                    - optionsPublicTrades
                    - optionsPositions
                    - optionsOpenOrders
                    - optionsRecentOrders
                    - optionsSettlements
                    - optionsAccountSummary
              market:
                type: string
                description: >
                  A market, e.g. `BTC-USDT`, or `ALL` for every market.
                  Always a single string, never an array — send one
                  `subscribe` per market to follow several. Composes with
                  `expiration`, `strike`, and `type` into a contract filter
                  exactly as on the connection URL (a packed contract name
                  is rejected). Omitting all four applies the connection's
                  own filter. Defaults to the connection's market
              expiration:
                type: string
                description: Contract expiration, e.g. `24JUN26`. Requires `market`
              strike:
                type: string
                description: Strike price, e.g. `62000`. Requires `expiration`
              type:
                type: string
                enum: [C, P]
                description: "`C` (call) or `P` (put). Requires `strike`"
            required: [subscriptions]
        required: [message, content]
      examples:
        - payload:
            message: subscribe
            content:
              clientRequestId: cfff0f58-8780-4cf2-b3d3-6439fed37304
              subscriptions: [optionsPositions, optionsOpenOrders, optionsPublicOrderBook]
              market: BTC-USDT
              expiration: 24JUN26
              strike: "62000"
              type: C

    SubscribedResponse:
      name: subscribed
      title: Subscribed
      summary: Success response to `subscribe`. Subscription lists are flat stream names; track markets client-side.
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `subscribed`.
          data:
            type: object
            properties:
              activeSubscriptions:
                type: array
                description: >
                  All currently active subscriptions after the operation. A
                  flat list of stream names carrying no market information
                items:
                  type: string
              requestedSubscriptions:
                type: array
                description: The specific subscriptions that were requested to be added
                items:
                  type: string
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
              statusCode:
                type: integer
                description: Always `200`.
            required: [activeSubscriptions, requestedSubscriptions, statusCode]
        required: [resultType, data]
      examples:
        - payload:
            resultType: subscribed
            data:
              activeSubscriptions: [optionsOrders, optionsPositions, optionsOpenOrders, optionsPublicOrderBook]
              requestedSubscriptions: [optionsPositions, optionsOpenOrders, optionsPublicOrderBook]
              clientRequestId: cfff0f58-8780-4cf2-b3d3-6439fed37304
              statusCode: 200

    SubscribeError:
      name: subscribeError
      title: Subscribe — Error
      summary: >
        Error response to `subscribe`; nothing is subscribed. Note
        `resultType` is `subscribe` on failure, not `subscribed`.
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `subscribe`.
          data:
            type: object
            properties:
              statusCode:
                type: integer
                description: "`400`, or `429` when the subscription limit is reached."
              body:
                type: string
                description: >
                  The reason, such as `invalid_subscriptions`, or
                  `Subscription limit reached (max N)` on a `429`
              error:
                $ref: '#/components/schemas/ErrorDetail'
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
            required: [statusCode, body, error]
        required: [resultType, data]
      examples:
        - name: WrongProduct
          payload:
            resultType: subscribe
            data:
              statusCode: 400
              body: wrong_product_subscriptions
              error:
                slug: BAD_REQUEST
                code: "SYS-0006"
              clientRequestId: cfff0f58-8780-4cf2-b3d3-6439fed37304
        - name: SubscriptionLimit
          payload:
            resultType: subscribe
            data:
              statusCode: 429
              body: Subscription limit reached (max 100)
              error:
                slug: SUBSCRIPTION_LIMIT
                code: "SYS-0012"
              clientRequestId: cfff0f58-8780-4cf2-b3d3-6439fed37304

    UnsubscribeRequest:
      name: unsubscribe
      title: Unsubscribe
      summary: Remove one or more streams from the current connection, for one market or all.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `unsubscribe`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
              subscriptions:
                type: array
                description: One or more subscriptions to remove
                items:
                  type: string
                  enum:
                    - optionsOrders
                    - optionsContracts
                    - optionsQuotes
                    - optionsPublicOrderBook
                    - optionsPublicTrades
                    - optionsPositions
                    - optionsOpenOrders
                    - optionsRecentOrders
                    - optionsSettlements
                    - optionsAccountSummary
              market:
                type: string
                description: >
                  A market, e.g. `BTC-USDT`. Omitting it, or sending `ALL`,
                  removes the listed streams from **every market they are
                  active on** — unlike `subscribe`, it does not fall back to
                  the connection's own market. Composes with `expiration`,
                  `strike`, and `type` into a contract filter exactly as on
                  the connection URL
              expiration:
                type: string
                description: Contract expiration, e.g. `24JUN26`. Requires `market`
              strike:
                type: string
                description: Strike price, e.g. `62000`. Requires `expiration`
              type:
                type: string
                enum: [C, P]
                description: "`C` (call) or `P` (put). Requires `strike`"
            required: [subscriptions]
        required: [message, content]
      examples:
        - payload:
            message: unsubscribe
            content:
              clientRequestId: b21f0f58-8780-4cf2-b3d3-6439fed37304
              subscriptions: [optionsPublicOrderBook]
              market: BTC-USDT
              expiration: 24JUN26
              strike: "62000"
              type: C

    UnsubscribedResponse:
      name: unsubscribed
      title: Unsubscribed
      summary: Success response to `unsubscribe`. Subscription lists are flat stream names; track markets client-side.
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `unsubscribed`.
          data:
            type: object
            properties:
              activeSubscriptions:
                type: array
                description: >
                  All currently active subscriptions after the operation. A
                  flat list of stream names carrying no market information
                items:
                  type: string
              requestedUnsubscriptions:
                type: array
                description: The specific subscriptions that were requested to be removed
                items:
                  type: string
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
              statusCode:
                type: integer
                description: Always `200`.
            required: [activeSubscriptions, requestedUnsubscriptions, statusCode]
        required: [resultType, data]
      examples:
        - payload:
            resultType: unsubscribed
            data:
              activeSubscriptions: [optionsOrders, optionsPositions, optionsOpenOrders]
              requestedUnsubscriptions: [optionsPublicOrderBook]
              clientRequestId: b21f0f58-8780-4cf2-b3d3-6439fed37304
              statusCode: 200

    UnsubscribeError:
      name: unsubscribeError
      title: Unsubscribe — Error
      summary: >
        Error response to `unsubscribe`; nothing is unsubscribed. Note
        `resultType` is `unsubscribe` on failure, not `unsubscribed`.
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `unsubscribe`.
          data:
            type: object
            properties:
              statusCode:
                type: integer
                description: Always `400`.
              body:
                type: string
                description: The reason, such as `no matching subscription`
              error:
                $ref: '#/components/schemas/ErrorDetail'
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
            required: [statusCode, body, error]
        required: [resultType, data]
      examples:
        - payload:
            resultType: unsubscribe
            data:
              statusCode: 400
              body: no matching subscription
              error:
                slug: BAD_REQUEST
                code: "SYS-0006"
              clientRequestId: b21f0f58-8780-4cf2-b3d3-6439fed37304

    ConnectionShutdownNotice:
      name: connectionShutdown
      title: Connection Shutdown
      summary: Pushed before the connection is closed, carrying the deadline by which it must be re-established.
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `connectionShutdown`.
          data:
            type: object
            properties:
              forceCloseInMs:
                type: integer
                description: Milliseconds from this message until the connection is closed.
              statusCode:
                type: integer
                description: Always `200`.
              ts:
                type: integer
                format: int64
                description: When this notice was sent, in epoch milliseconds.
            required: [forceCloseInMs, statusCode, ts]
        required: [resultType, data]
      examples:
        - payload:
            resultType: connectionShutdown
            data:
              forceCloseInMs: 60000
              statusCode: 200
              ts: 1785258083038

    CreateOrderRequest:
      name: createOrder
      title: Create Order
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `createOrder`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
              market:
                type: string
                description: Contract name; required unless the connection is scoped to one contract
              price:
                type: string
                description: Limit price; for market orders, the expected price
              quantity:
                type: string
                description: Order quantity
              orderType:
                type: string
                enum: [buy, sell]
                description: Order side
              tradeType:
                type: string
                enum: [limit, market]
                description: Order type
              postOnly:
                type: boolean
                description: Maker-only flag; limit orders only
              reduceOnly:
                type: boolean
                description: Restrict the order to reducing an existing position
              maxSlippage:
                type: string
                description: Market orders only; `0 - 1` inclusive. `0` behaves as IOC
              orderId:
                type: string
                description: Unique identifier for the order, a ULID. Generated if omitted.
            required: [price, quantity, orderType, tradeType]
        required: [message, content]
      examples:
        - name: LimitOrder
          payload:
