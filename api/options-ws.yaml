        orderStatus:
          type: string
          enum: [pending, open, cancelled, completed, rejected, not_found]
          description: >
            `pending` awaiting acceptance; `open` resting on the book;
            `cancelled` cancelled; `completed` completely filled;
            `rejected` rejected; `not_found` no such order, on a `404`
        postOnly:
