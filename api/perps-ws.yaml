asyncapi: 3.0.0
info:
  title: Rails Perps WebSocket API
  version: 1.0.0
  description: >
    Real-time market data, order updates, and execution events for Rails
    Perpetuals. All requests and responses share a common envelope: requests
    are `{"message": "<requestType>", "content": {...}}`, responses and
    stream pushes are `{"resultType": "<responseType>", "market"?: "...",
    "data": {...}}`.
defaultContentType: application/json

servers:
  sandbox:
    host: ws.sandbox.rails.xyz
    protocol: wss
    description: >
      Connect with a fixed `product=perpetuals` query parameter, plus
      `market` and (optionally) `subscriptions` query parameters, e.g.
      `wss://ws.sandbox.rails.xyz?product=perpetuals&market=BTC-USDT&subscriptions=orders,trades,publicTrades,publicOrderBook`.
      While `market=ALL` is supported, a separate connection per market is
      recommended in production so that issues on one connection cannot
      disrupt data for other markets. An optional `sessionId` (UUID) query
      parameter enables [WebSocket Session](/latest/websocket-session) on
      the Order Creation Stream.
    security:
      - $ref: '#/components/securitySchemes/wsAuth'

channels:
  commonRequests:
    address: "?product=perpetuals&market={market}"
    title: Common Requests
    description: >
      Requests and responses available on every connection regardless of
      active subscriptions.
    parameters:
      market:
        description: >
          A specific market (e.g. `BTC-USDT`) or `ALL`. When `ALL` is used,
          `market` must be supplied explicitly in the `content` of every
          request that accepts it.
        default: BTC-USDT
    messages:
      pingRequest:
        $ref: '#/components/messages/PingRequest'
      pongResponse:
        $ref: '#/components/messages/PongResponse'
      subscribeRequest:
        $ref: '#/components/messages/SubscribeRequest'
      subscribedResponse:
        $ref: '#/components/messages/SubscribedResponse'
      unsubscribeRequest:
        $ref: '#/components/messages/UnsubscribeRequest'
      unsubscribedResponse:
        $ref: '#/components/messages/UnsubscribedResponse'
      subscribeError:
        $ref: '#/components/messages/SubscribeError'
      unsubscribeError:
        $ref: '#/components/messages/UnsubscribeError'
      connectionShutdownNotice:
        $ref: '#/components/messages/ConnectionShutdownNotice'

  orderCreationStream:
    address: "?product=perpetuals&market={market}&subscriptions=orders&sessionId={sessionId}"
    title: Order Creation Stream
    description: >
      Active on the `orders` subscription, which is on by default when you
      connect (unless the `subscriptions` query parameter replaces it).
      Create, modify, and cancel orders, update isolated margin, and
      receive fill/rejection notifications. Supports a
      [WebSocket Session](/latest/websocket-session) via the connection's
      `sessionId` query parameter.
    parameters:
      market:
        description: >
          A specific market (e.g. `BTC-USDT`) or `ALL`. When `ALL` is used,
          `market` must be supplied explicitly in the `content` of every
          request that accepts it.
        default: BTC-USDT
      sessionId:
        description: >
          UUID identifying a session. Enables
          [WebSocket Session](/latest/websocket-session) on this stream.
          Omit to opt out.
        default: d785d51c-054e-4e33-9738-92d04ede9fab
    messages:
      createOrderRequest:
        $ref: '#/components/messages/CreateOrderRequest'
      createOrderAck:
        $ref: '#/components/messages/CreateOrderAck'
      createOrderConfirmation:
        $ref: '#/components/messages/CreateOrderConfirmation'
      createOrderError:
        $ref: '#/components/messages/CreateOrderError'
      modifyOrderRequest:
        $ref: '#/components/messages/ModifyOrderRequest'
      modifyOrderAck:
        $ref: '#/components/messages/ModifyOrderAck'
      modifyOrderConfirmation:
        $ref: '#/components/messages/ModifyOrderConfirmation'
      modifyOrderError:
        $ref: '#/components/messages/ModifyOrderError'
      cancelOrderRequest:
        $ref: '#/components/messages/CancelOrderRequest'
      cancelOrderAck:
        $ref: '#/components/messages/CancelOrderAck'
      cancelOrderConfirmation:
        $ref: '#/components/messages/CancelOrderConfirmation'
      cancelOrderError:
        $ref: '#/components/messages/CancelOrderError'
      updateMarginRequest:
        $ref: '#/components/messages/UpdateMarginRequest'
      updateMarginAck:
        $ref: '#/components/messages/UpdateMarginAck'
      updateMarginConfirmation:
        $ref: '#/components/messages/UpdateMarginConfirmation'
      updateMarginError:
        $ref: '#/components/messages/UpdateMarginError'
      completeFillNotification:
        $ref: '#/components/messages/CompleteFillNotification'
      partialFillNotification:
        $ref: '#/components/messages/PartialFillNotification'
      rejectOrderNotification:
        $ref: '#/components/messages/RejectOrderNotification'
      sessionBackfillNotification:
        $ref: '#/components/messages/SessionBackfillNotification'

  accountTradesStream:
    address: "?product=perpetuals&market={market}&subscriptions=trades"
    title: Account Trades Stream
    description: >
      Available on the `trades` subscription. Real-time fills for your
      account across all markets, regardless of which market you connected
      with.
    parameters:
      market:
        description: >
          A specific market (e.g. `BTC-USDT`) or `ALL`. When `ALL` is used,
          `market` must be supplied explicitly in the `content` of every
          request that accepts it.
        default: BTC-USDT
    messages:
      completedOrdersDelta:
        $ref: '#/components/messages/CompletedOrdersDelta'

  publicTradesStream:
    address: "?product=perpetuals&market={market}&subscriptions=publicTrades"
    title: Public Trades Stream
    description: >
      Available on the `publicTrades` subscription. Real-time trade
      executions and on-demand snapshots for a specific market.
    parameters:
      market:
        description: >
          A specific market (e.g. `BTC-USDT`) or `ALL`. When `ALL` is used,
          `market` must be supplied explicitly in the `content` of every
          request that accepts it.
        default: BTC-USDT
    messages:
      emitPublicCompletedOrdersRequest:
        $ref: '#/components/messages/EmitPublicCompletedOrdersRequest'
      publicCompletedOrdersResponse:
        $ref: '#/components/messages/PublicCompletedOrdersResponse'
      publicCompletedOrdersDelta:
        $ref: '#/components/messages/PublicCompletedOrdersDelta'

  publicOrderBookStream:
    address: "?product=perpetuals&market={market}&subscriptions=publicOrderBook"
    title: Order Book Stream
    description: >
      Available on the `publicOrderBook` subscription. Real-time order book
      deltas and on-demand full snapshots for a specific market.
    parameters:
      market:
        description: >
          A specific market (e.g. `BTC-USDT`) or `ALL`. When `ALL` is used,
          `market` must be supplied explicitly in the `content` of every
          request that accepts it.
        default: BTC-USDT
    messages:
      emitPublicOrderBookRequest:
        $ref: '#/components/messages/EmitPublicOrderBookRequest'
      publicOrderBookResponse:
        $ref: '#/components/messages/PublicOrderBookResponse'
      publicOrderBookDelta:
        $ref: '#/components/messages/PublicOrderBookDelta'

operations:
  ping:
    action: receive
    channel:
      $ref: '#/channels/commonRequests'
    summary: Application-level heartbeat, available with or without a subscription.
    messages:
      - $ref: '#/channels/commonRequests/messages/pingRequest'
  pong:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    messages:
      - $ref: '#/channels/commonRequests/messages/pongResponse'
  subscribe:
    action: receive
    channel:
      $ref: '#/channels/commonRequests'
    summary: Add one or more streams to the current connection. Idempotent.
    messages:
      - $ref: '#/channels/commonRequests/messages/subscribeRequest'
  subscribed:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    summary: Confirmation (200) or error response to `subscribe`.
    messages:
      - $ref: '#/channels/commonRequests/messages/subscribedResponse'
      - $ref: '#/channels/commonRequests/messages/subscribeError'
  unsubscribe:
    action: receive
    channel:
      $ref: '#/channels/commonRequests'
    summary: Remove one or more streams from the current connection. Idempotent.
    messages:
      - $ref: '#/channels/commonRequests/messages/unsubscribeRequest'
  unsubscribed:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    summary: Confirmation (200) or error response to `unsubscribe`.
    messages:
      - $ref: '#/channels/commonRequests/messages/unsubscribedResponse'
      - $ref: '#/channels/commonRequests/messages/unsubscribeError'
  connectionShutdown:
    action: send
    channel:
      $ref: '#/channels/commonRequests'
    summary: Pushed unprompted when the connection is scheduled to close; reconnect before the deadline it carries.
    messages:
      - $ref: '#/channels/commonRequests/messages/connectionShutdownNotice'

  createOrder:
    action: receive
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Create a limit or market order.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/createOrderRequest'
  createOrderResult:
    action: send
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Acknowledgment (202), confirmation (200), or error response to `createOrder`.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/createOrderAck'
      - $ref: '#/channels/orderCreationStream/messages/createOrderConfirmation'
      - $ref: '#/channels/orderCreationStream/messages/createOrderError'

  modifyOrder:
    action: receive
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Modify the price and/or quantity of an existing order.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/modifyOrderRequest'
  modifyOrderResult:
    action: send
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: >
      Acknowledgment (202), confirmation (200) carrying the replacement
      order, or error response to `modifyOrder`.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/modifyOrderAck'
      - $ref: '#/channels/orderCreationStream/messages/modifyOrderConfirmation'
      - $ref: '#/channels/orderCreationStream/messages/modifyOrderError'

  cancelOrder:
    action: receive
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Cancel an order by ID.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/cancelOrderRequest'
  cancelOrderResult:
    action: send
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Acknowledgment (202), confirmation (200), or error response to `cancelOrder`.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/cancelOrderAck'
      - $ref: '#/channels/orderCreationStream/messages/cancelOrderConfirmation'
      - $ref: '#/channels/orderCreationStream/messages/cancelOrderError'

  updateMargin:
    action: receive
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Set the absolute target value of the isolated position margin.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/updateMarginRequest'
  updateMarginResult:
    action: send
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Acknowledgment (202), confirmation (200, including no-op), or error response to `updateMargin`.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/updateMarginAck'
      - $ref: '#/channels/orderCreationStream/messages/updateMarginConfirmation'
      - $ref: '#/channels/orderCreationStream/messages/updateMarginError'

  orderFilled:
    action: send
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Pushed when an order is completely or partially filled.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/completeFillNotification'
      - $ref: '#/channels/orderCreationStream/messages/partialFillNotification'
  orderRejected:
    action: send
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: Pushed when an order is rejected.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/rejectOrderNotification'

  sessionBackfill:
    action: send
    channel:
      $ref: '#/channels/orderCreationStream'
    summary: >
      Pushed once per connection when `sessionId` is supplied and the
      connection is subscribed to the Order Creation Stream. Summarizes any
      missed order events backfilled since the last delivered position, or
      reports that none were backfilled.
    messages:
      - $ref: '#/channels/orderCreationStream/messages/sessionBackfillNotification'

  accountTradesUpdate:
    action: send
    channel:
      $ref: '#/channels/accountTradesStream'
    summary: Pushed whenever new trades are executed on your account.
    messages:
      - $ref: '#/channels/accountTradesStream/messages/completedOrdersDelta'

  emitPublicCompletedOrders:
    action: receive
    channel:
      $ref: '#/channels/publicTradesStream'
    summary: >
      Request a snapshot of recent public trades. Useful for initial state
      hydration, reconnect recovery, and reconciliation before processing
      delta updates.
    messages:
      - $ref: '#/channels/publicTradesStream/messages/emitPublicCompletedOrdersRequest'
  publicCompletedOrdersSnapshot:
    action: send
    channel:
      $ref: '#/channels/publicTradesStream'
    summary: Response to `emitPublicCompletedOrders`.
    messages:
      - $ref: '#/channels/publicTradesStream/messages/publicCompletedOrdersResponse'
  publicTradesUpdate:
    action: send
    channel:
      $ref: '#/channels/publicTradesStream'
    summary: Pushed whenever new trades are executed in the subscribed market.
    messages:
      - $ref: '#/channels/publicTradesStream/messages/publicCompletedOrdersDelta'

  emitPublicOrderBook:
    action: receive
    channel:
      $ref: '#/channels/publicOrderBookStream'
    summary: >
      Request a full order book snapshot. Useful for bootstrapping and
      resynchronizing local book state before processing delta updates.
    messages:
      - $ref: '#/channels/publicOrderBookStream/messages/emitPublicOrderBookRequest'
  publicOrderBookSnapshot:
    action: send
    channel:
      $ref: '#/channels/publicOrderBookStream'
    summary: Response to `emitPublicOrderBook`.
    messages:
      - $ref: '#/channels/publicOrderBookStream/messages/publicOrderBookResponse'
  publicOrderBookUpdate:
    action: send
    channel:
      $ref: '#/channels/publicOrderBookStream'
    summary: Pushed whenever the order book changes for the subscribed market.
    messages:
      - $ref: '#/channels/publicOrderBookStream/messages/publicOrderBookDelta'

components:
  securitySchemes:
    wsAuth:
      type: httpApiKey
      in: header
      name: Sec-WebSocket-Protocol
      description: >
        Supply as `authorization#<JWT>` during the WebSocket handshake.

  schemas:
    Order:
      type: object
      description: >
        Omitted entirely from some error responses; when present, all
        fields below are populated.
      properties:
        market:
          type: string
          description: Market name
        orderId:
          type: string
          description: Unique identifier for the order
        orderType:
          type: string
          enum: [buy, sell]
          description: Order side
        tradeType:
          type: string
          enum: [limit, market]
          description: Order type
        price:
          type: string
          description: Limit price; for market orders, expected/executed price
        quantity:
          type: string
          description: Remaining quantity
        filledQuantity:
          type: string
          description: Filled quantity
        leverage:
          type: string
          description: Leverage used at order creation/modification
        createdAt:
          type: integer
          format: int64
          description: Milliseconds since epoch
        updatedAt:
          type: integer
          format: int64
          description: Milliseconds since epoch
        orderStatus:
          type: string
          enum: [pending, active, cancelling, cancelled, modifying, modified, rejected]
          description: >
            `pending` awaiting acceptance; `active` resting on the book;
            `cancelling` cancellation in progress; `cancelled` cancelled;
            `modifying` modification in progress; `modified` superseded by a
            modification (cancelled and replaced by a new order); `rejected`
            rejected
        clientRequestId:
          type: string
          description: Client-generated UUID for correlation
        reduceOnly:
          type: boolean
          description: Restricts the order to reducing an existing position
        postOnly:
          type: boolean
          description: Maker-only creation flag
        avgFillPrice:
          type: string
          description: Average price across fills; present once at least one fill has occurred
      required:
        - market
        - orderId
        - orderType
        - tradeType
        - price
        - quantity
        - filledQuantity
        - leverage
        - createdAt
        - updatedAt
        - orderStatus
        - reduceOnly
        - postOnly

    ErrorDetail:
      type: object
      properties:
        slug:
          type: string
          description: Machine-readable error slug
        code:
          type: string
          description: Error code
      required: [slug, code]

    OrderBookLevel:
      type: object
      properties:
        orderType:
          type: string
          enum: [buy, sell]
          description: Order side
        price:
          type: string
          description: Price level
        quantity:
          type: string
          description: Size at the price level; `0` in a delta removes the level
      required: [orderType, price, quantity]

    PublicTradeExecution:
      type: object
      properties:
        executionType:
          type: string
          enum: [taker, maker]
          description: Execution role
        matchId:
          type: string
          description: Unique identifier for the trade match
        orderType:
          type: string
          enum: [buy, sell]
          description: Order side
        price:
          type: string
          description: Execution price
        quantity:
          type: string
          description: Execution quantity
        updatedAt:
          type: integer
          format: int64
          description: Execution timestamp (milliseconds since epoch)
      required: [executionType, matchId, orderType, price, quantity, updatedAt]

    AccountTradeFill:
      type: object
      properties:
        market:
          type: string
          description: Market name
        orderId:
          type: string
          description: Unique identifier of the order
        matchId:
          type: string
          description: Unique identifier for the trade match
        orderType:
          type: string
          enum: [buy, sell]
          description: Order side
        tradeType:
          type: string
          enum: [limit, market]
          description: Order type
        executionType:
          type: string
          enum: [taker, maker]
          description: Execution role
        fillType:
          type: string
          enum: [partial, complete]
          description: Whether this execution completely or partially filled the order
        price:
          type: string
          description: Execution price
        quantity:
          type: string
          description: Execution quantity
        originalQuantity:
          type: string
          description: Order quantity before any fill
        leverage:
          type: string
          description: Leverage at time of execution
        fees:
          type: string
          description: Fees charged for the trade
        createdAt:
          type: integer
          format: int64
          description: Order creation timestamp (milliseconds since epoch)
        updatedAt:
          type: integer
          format: int64
          description: Fill timestamp (milliseconds since epoch)
        triggerType:
          type: string
          enum: [none, take_profit, stop_loss, liquidation]
          description: What triggered order creation, if anything
        triggerPrice:
          type: string
          description: Price that triggered order creation; present when `triggerType` is not `none`
        triggerCreatedAt:
          type: integer
          format: int64
          description: Trigger creation timestamp (milliseconds since epoch)
      required:
        - market
        - orderId
        - matchId
        - orderType
        - tradeType
        - executionType
        - fillType
        - price
        - quantity
        - originalQuantity
        - leverage
        - fees
        - createdAt
        - updatedAt
        - triggerType
        - triggerPrice
        - triggerCreatedAt

  messages:
    PingRequest:
      name: ping
      title: Ping
      summary: Connection health check.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `ping`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
        required: [message]
      examples:
        - payload:
            message: ping
            content:
              clientRequestId: 4cc68b60-ed2d-42aa-a21e-cb5486f8fd1a

    PongResponse:
      name: pong
      title: Pong
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `pong`.
          data:
            type: object
            properties:
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
              statusCode:
                type: integer
                description: Always `200`.
            required: [statusCode]
        required: [resultType, data]
      examples:
        - payload:
            resultType: pong
            data:
              clientRequestId: 4cc68b60-ed2d-42aa-a21e-cb5486f8fd1a
              statusCode: 200

    SubscribeRequest:
      name: subscribe
      title: Subscribe
      summary: Add one or more streams to the current connection.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `subscribe`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
              subscriptions:
                type: array
                description: One or more subscriptions to add
                items:
                  type: string
                  enum: [orders, trades, publicTrades, publicOrderBook]
            required: [subscriptions]
        required: [message, content]
      examples:
        - payload:
            message: subscribe
            content:
              clientRequestId: cfff0f58-8780-4cf2-b3d3-6439fed37304
              subscriptions: [trades, publicTrades, publicOrderBook]

    SubscribedResponse:
      name: subscribed
      title: Subscribed
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `subscribed`.
          data:
            type: object
            properties:
              activeSubscriptions:
                type: array
                description: All currently active subscriptions after the operation
                items:
                  type: string
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
              requestedSubscriptions:
                type: array
                description: The specific subscriptions that were requested to be added
                items:
                  type: string
              statusCode:
                type: integer
                description: Always `200`.
            required: [activeSubscriptions, requestedSubscriptions, statusCode]
        required: [resultType, data]
      examples:
        - payload:
            resultType: subscribed
            data:
              activeSubscriptions: [orders, trades, publicTrades, publicOrderBook]
              clientRequestId: cfff0f58-8780-4cf2-b3d3-6439fed37304
              requestedSubscriptions: [trades, publicTrades, publicOrderBook]
              statusCode: 200

    UnsubscribeRequest:
      name: unsubscribe
      title: Unsubscribe
      summary: Remove one or more streams from the current connection.
      payload:
        type: object
        properties:
          message:
            type: string
            description: Always `unsubscribe`.
          content:
            type: object
            properties:
              clientRequestId:
                type: string
                format: uuid
                description: Client-generated UUID for correlation
              subscriptions:
                type: array
                description: One or more subscriptions to remove
                items:
                  type: string
                  enum: [orders, trades, publicTrades, publicOrderBook]
            required: [subscriptions]
        required: [message, content]
      examples:
        - payload:
            message: unsubscribe
            content:
              clientRequestId: 245867a5-0de9-4542-a9da-724577ab4102
              subscriptions: [trades, publicTrades, publicOrderBook]

    UnsubscribedResponse:
      name: unsubscribed
      title: Unsubscribed
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `unsubscribed`.
          data:
            type: object
            properties:
              activeSubscriptions:
                type: array
                description: Remaining active subscriptions after the operation
                items:
                  type: string
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
              requestedUnsubscriptions:
                type: array
                description: The specific subscriptions that were requested to be removed
                items:
                  type: string
              statusCode:
                type: integer
                description: Always `200`.
            required: [activeSubscriptions, requestedUnsubscriptions, statusCode]
        required: [resultType, data]
      examples:
        - payload:
            resultType: unsubscribed
            data:
              activeSubscriptions: [orders]
              clientRequestId: 245867a5-0de9-4542-a9da-724577ab4102
              requestedUnsubscriptions: [trades, publicTrades, publicOrderBook]
              statusCode: 200

    SubscribeError:
      name: subscribeError
      title: Subscribe — Error
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `subscribe`.
          data:
            type: object
            properties:
              statusCode:
                type: integer
                enum: [400, 429]
                description: Error status code
              body:
                type: string
                description: Status message
              error:
                $ref: '#/components/schemas/ErrorDetail'
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
            required: [statusCode, body, error]
        required: [resultType, data]
      examples:
        - name: LimitReached
          payload:
            resultType: subscribe
            data:
              statusCode: 429
              body: Subscription limit reached (max 100)
              error:
                slug: SUBSCRIPTION_LIMIT
                code: "SYS-0012"
              clientRequestId: cfff0f58-8780-4cf2-b3d3-6439fed37304

    UnsubscribeError:
      name: unsubscribeError
      title: Unsubscribe — Error
      payload:
        type: object
        properties:
          resultType:
            type: string
            description: Always `unsubscribe`.
          data:
            type: object
            properties:
              statusCode:
                type: integer
                enum: [400]
                description: Error status code
              body:
                type: string
                description: Status message
              error:
                $ref: '#/components/schemas/ErrorDetail'
              clientRequestId:
                type: string
                description: Client-generated UUID for correlation
            required: [statusCode, body, error]
        required: [resultType, data]
      examples:
        - name: InvalidSubscriptions
          payload:
